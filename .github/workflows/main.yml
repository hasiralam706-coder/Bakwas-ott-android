name: Build BAKWAS OTT APK

'on':
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Extract ZIP and Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and Extract Android Project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE="$(find "$GITHUB_WORKSPACE" -type f -iname 'BAKWAS_OTT_Cloudinary_Admin_Updated.zip' -not -path '*/.git/*' -print -quit)"

          if [ -z "$ZIP_FILE" ]; then
            echo "::error::BAKWAS_OTT_Cloudinary_Admin_Updated.zip not found in repository."
            echo "Upload the ZIP to the repository, then run this workflow again."
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          EXTRACT_DIR="$RUNNER_TEMP/android-project"
          mkdir -p "$EXTRACT_DIR"
          unzip -oq "$ZIP_FILE" -d "$EXTRACT_DIR"

          PROJECT_DIR=""
          while IFS= read -r -d '' FILE; do
            DIR="$(dirname "$FILE")"
            if [ -f "$DIR/app/build.gradle.kts" ] || [ -f "$DIR/app/build.gradle" ]; then
              PROJECT_DIR="$DIR"
              break
            fi
          done < <(find "$EXTRACT_DIR" -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print0)

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::No Android Gradle project found inside the ZIP."
            find "$EXTRACT_DIR" -maxdepth 5 -type f
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project found: $PROJECT_DIR"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK Packages
        shell: bash
        run: |
          set -euo pipefail

          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"

          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager was not found in the runner Android SDK."
            find "$ANDROID_HOME" -maxdepth 4 -type f -name sdkmanager
            exit 1
          fi

          echo "Using sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true

          "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Build Debug APK
        shell: bash
        run: |
          set -euo pipefail
          cd "$PROJECT_DIR"

          gradle --no-daemon --stacktrace assembleDebug

          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK" ]; then
            echo "::error::Debug APK was not generated."
            find "$PROJECT_DIR/app/build/outputs" -type f 2>/dev/null || true
            exit 1
          fi

          echo "APK generated:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: BAKWAS-OTT-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
          
